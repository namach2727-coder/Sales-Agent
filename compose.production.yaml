name: directpilot-production

services:
  directpilot:
    image: ${DIRECTPILOT_IMAGE:-directpilot:production}
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      DIRECTPILOT_ENV_PROFILE: production
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgresql:5432/${POSTGRES_DB:?POSTGRES_DB is required}
    depends_on:
      postgresql:
        condition: service_healthy
    ports:
      - "${PRODUCTION_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8000}:8000"
    volumes:
      - type: volume
        source: directpilot_media
        target: /app/private_media
      - type: volume
        source: directpilot_receipts
        target: /app/private_receipts
      - type: volume
        source: directpilot_backups
        target: /app/backups
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          request = urllib.request.Request('http://127.0.0.1:8000/ready', headers={'X-Forwarded-Proto': 'https'});
          urllib.request.urlopen(request, timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s
    networks:
      - production

  instagram-gateway:
    image: ${DIRECTPILOT_IMAGE:-directpilot:production}
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      DIRECTPILOT_ENV_PROFILE: production
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgresql:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      WEB_CONCURRENCY: "1"
    entrypoint:
      - uvicorn
      - app.public_instagram_gateway:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --no-access-log
      - --proxy-headers
      - --forwarded-allow-ips
      - ${FORWARDED_ALLOW_IPS:?FORWARDED_ALLOW_IPS is required}
    depends_on:
      directpilot:
        condition: service_healthy
      postgresql:
        condition: service_healthy
    ports:
      - "${PRODUCTION_BIND_ADDRESS:-127.0.0.1}:${INSTAGRAM_GATEWAY_PORT:-8001}:8001"
    volumes:
      - type: volume
        source: directpilot_media
        target: /app/private_media
        read_only: true
    tmpfs:
      - /app/logs:uid=10001,gid=10001,mode=0750
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8001/privacy', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    stop_grace_period: 30s
    networks:
      - production

  postgresql:
    image: postgres:17.5-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - type: volume
        source: postgresql_data
        target: /var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 60s
    networks:
      - production

volumes:
  directpilot_media:
  directpilot_receipts:
  directpilot_backups:
  postgresql_data:

networks:
  production:
    driver: bridge
