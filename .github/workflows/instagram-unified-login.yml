name: Instagram Unified Login Tests

on:
  push:
    branches:
      - feature/instagram-unified-login
  pull_request:
    paths:
      - "app/instagram_onboarding/**"
      - "tests/test_instagram_unified_login.py"
      - ".github/workflows/instagram-unified-login.yml"

permissions:
  contents: read

jobs:
  instagram-unified-login:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./ci-instagram-test.db
      META_SEND_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Compile Instagram onboarding modules and tests
        run: python -m compileall -q app/instagram_onboarding tests/test_instagram_unified_login.py
      - name: Run focused Unified Login contract tests
        run: python -m pytest tests/test_instagram_unified_login.py -q
