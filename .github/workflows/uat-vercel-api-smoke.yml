name: UAT Vercel API read-only smoke

on:
  push:
    branches:
      - migration/vercel-uat-fastapi-20261014
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uat-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify isolated Vercel UAT API live / ready / version
        env:
          UAT_BASE_URL: https://directpilot-uat-api.vercel.app
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ["UAT_BASE_URL"].rstrip("/")
          result = None
          for attempt in range(1, 25):
              try:
                  with urllib.request.urlopen(base + "/ready", timeout=12) as response:
                      raw = response.read(3000).decode("utf-8", errors="replace")
                      ready = json.loads(raw)
                      print("attempt", attempt, "/ready", ready)
                      if (
                          ready.get("status") == "ready"
                          and ready.get("database") == "available"
                          and ready.get("migration") == "current"
                      ):
                          result = ready
                          break
              except (urllib.error.URLError, ValueError, TimeoutError) as exc:
                  print("attempt", attempt, "not ready:", str(exc)[:250])
              time.sleep(10)
          if result is None:
              raise SystemExit("UAT /ready did not reach database=available migration=current")
          for endpoint in ("/live", "/version"):
              with urllib.request.urlopen(base + endpoint, timeout=12) as response:
                  body = response.read(1500).decode("utf-8", errors="replace")
                  print(endpoint, response.status, body[:500])
                  assert response.status == 200, endpoint
          PY
