name: Initialize dedicated Neon UAT schema

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Run non-mutating preflight first, then migrate only after checking the result."
        type: choice
        required: true
        options:
          - preflight
          - migrate
      target_confirmation:
        description: "Type the exact approved project name: directpilot-uat-v2"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: neon-uat-schema-bootstrap
  cancel-in-progress: false

jobs:
  neon-uat:
    if: ${{ inputs.target_confirmation == 'directpilot-uat-v2' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEON_UAT_DIRECT_DATABASE_URL: ${{ secrets.NEON_UAT_DIRECT_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backend-main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Require private direct Neon UAT database secret
        run: |
          if [ -z "$NEON_UAT_DIRECT_DATABASE_URL" ]; then
            echo "NEON_UAT_DIRECT_DATABASE_URL missing. Set as Actions repository secret."
            exit 1
          fi
      - name: Run the guarded Neon UAT operation
        env:
          REQUESTED_ACTION: ${{ inputs.action }}
        run: python -m tools.bootstrap_neon_uat_schema --action "$REQUESTED_ACTION"
