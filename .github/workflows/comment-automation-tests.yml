name: Comment automation contract tests

on:
  pull_request:
    branches: [backend-main]
    paths:
      - "app/automation_rules/**"
      - "app/application/outbound/**"
      - "app/application/services/instagram_outbound_delivery.py"
      - "app/infrastructure/outbound/instagram_graph_sender.py"
      - "tests/test_automation_rules.py"
      - "tests/test_automation_rule_runtime.py"
      - "tests/test_instagram_outbound_delivery.py"
      - ".github/workflows/comment-automation-tests.yml"

permissions:
  contents: read

jobs:
  comment-automation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - run: python -m pytest tests/test_automation_rules.py tests/test_automation_rule_runtime.py tests/test_instagram_outbound_delivery.py
        env:
          APP_ENV: test
          DATABASE_URL: sqlite:///./ci-test.db
