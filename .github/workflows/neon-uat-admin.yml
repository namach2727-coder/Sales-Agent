name: Bootstrap dedicated Neon UAT administrator

on:
  workflow_dispatch:
    inputs:
      admin_email:
        description: "Email of the new UAT-only platform administrator (not a secret)"
        type: string
        required: true
      target_confirmation:
        description: "Type exactly: directpilot-uat-v2"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: neon-uat-admin-bootstrap
  cancel-in-progress: false

jobs:
  neon-uat-admin:
    if: ${{ inputs.target_confirmation == 'directpilot-uat-v2' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEON_UAT_DIRECT_DATABASE_URL: ${{ secrets.NEON_UAT_DIRECT_DATABASE_URL }}
      NEON_UAT_ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.NEON_UAT_ADMIN_BOOTSTRAP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backend-main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Require dedicated UAT secrets
        run: |
          if [ -z "$NEON_UAT_DIRECT_DATABASE_URL" ] || [ -z "$NEON_UAT_ADMIN_BOOTSTRAP_PASSWORD" ]; then
            echo "UAT database or administrator bootstrap secret missing"
            exit 1
          fi
      - name: Guard and bootstrap first UAT administrator
        env:
          UAT_ADMIN_EMAIL: ${{ inputs.admin_email }}
        run: python -m tools.bootstrap_neon_uat_admin --email "$UAT_ADMIN_EMAIL"
