name: Instagram OAuth Relay Tests

on:
  pull_request:
    paths:
      - "app/instagram_onboarding/**"
      - "tests/test_instagram_onboarding.py"
      - ".github/workflows/instagram-oauth-relay.yml"
  push:
    paths:
      - "app/instagram_onboarding/**"
      - "tests/test_instagram_onboarding.py"
      - ".github/workflows/instagram-oauth-relay.yml"

permissions:
  contents: read

jobs:
  instagram-oauth-relay:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./instagram-oauth-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - run: python -m pytest tests/test_instagram_onboarding.py tests/test_instagram_unified_login.py -q
