name: DirectPilot Production DB Preflight
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Read-only inspection only"
        required: true
        type: choice
        options:
          - inspect
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate secret availability without printing credentials
        env:
          PROD_DB_URL: ${{ secrets.RENDER_PROD_DATABASE_URL }}
        run: |
          if [ -z "$PROD_DB_URL" ]; then
            echo "::error::Missing RENDER_PROD_DATABASE_URL repository secret"
            exit 1
          fi
          echo "Database secret is configured."
      - name: Read-only database inspection
        env:
          DATABASE_URL: ${{ secrets.RENDER_PROD_DATABASE_URL }}
          PGCONNECT_TIMEOUT: "8"
        run: |
          python -m pip install "SQLAlchemy>=2,<3" "psycopg[binary]>=3,<4" "psycopg2-binary>=2.9,<3"
          python scripts/ops/render_production_readonly_inventory.py
