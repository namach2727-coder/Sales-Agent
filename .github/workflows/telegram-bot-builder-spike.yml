name: Telegram bot-builder isolated spike

on:
  push:
    branches:
      - "feature/telegram-managed-bots-spike-*"
    paths:
      - "experiments/telegram_bot_builder/**"
      - ".github/workflows/telegram-bot-builder-spike.yml"
  pull_request:
    branches:
      - "feature/telegram-managed-bots-spike-20261017"
    paths:
      - "experiments/telegram_bot_builder/**"
      - ".github/workflows/telegram-bot-builder-spike.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated TelBot API dependencies
        run: python -m pip install -r experiments/telegram_bot_builder/requirements-uat.txt
      - name: Run offline Telegram builder and API security tests
        run: python -m unittest discover -s experiments/telegram_bot_builder -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install isolated DOM test dependency
        run: npm install --prefix "$RUNNER_TEMP/telbot-dom" --no-audit --no-fund jsdom@26.1.0
      - name: Run Mini App editor behavior tests without network
        run: |
          NODE_PATH="$RUNNER_TEMP/telbot-dom/node_modules" node experiments/telegram_bot_builder/test_builder_ui.cjs
          NODE_PATH="$RUNNER_TEMP/telbot-dom/node_modules" node experiments/telegram_bot_builder/test_builder_save.cjs

  schema-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: telbot
          POSTGRES_USER: telbot_test
          POSTGRES_PASSWORD: synthetic_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U telbot_test -d telbot"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TELBOT_TEST_DATABASE_URL: postgresql://telbot_test:synthetic_ci_only@127.0.0.1:5432/telbot
      TELBOT_TEST_UI_ROUNDTRIP: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r experiments/telegram_bot_builder/requirements-uat.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install isolated UI roundtrip dependency
        run: npm install --prefix "$RUNNER_TEMP/telbot-dom" --no-audit --no-fund jsdom@26.1.0
      - name: Verify migrations and real versioned rule/API storage
        run: NODE_PATH="$RUNNER_TEMP/telbot-dom/node_modules" python -m unittest experiments.telegram_bot_builder.test_builder_postgres -v
