name: Seed dedicated Neon UAT reference data

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Run read-only dry-run first; seed only after reviewing it."
        type: choice
        required: true
        options:
          - dry-run
          - seed
      target_confirmation:
        description: "Type exactly: directpilot-uat-v2"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: neon-uat-seed
  cancel-in-progress: false

jobs:
  neon-uat-seed:
    if: ${{ inputs.target_confirmation == 'directpilot-uat-v2' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEON_UAT_DIRECT_DATABASE_URL: ${{ secrets.NEON_UAT_DIRECT_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backend-main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check secret presence
        run: |
          if [ -z "$NEON_UAT_DIRECT_DATABASE_URL" ]; then
            echo "UAT direct database secret missing"
            exit 1
          fi
      - name: Guard and seed UAT reference data
        env:
          REQUESTED_ACTION: ${{ inputs.action }}
        run: python -m tools.bootstrap_neon_uat_seed --action "$REQUESTED_ACTION"
